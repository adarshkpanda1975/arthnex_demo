<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital AEGIS - Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(135deg, #07111f, #102a43);

            color: white;
        }

        .box {
            width: 90%;
            max-width: 400px;

            padding: 35px;

            background: rgba(255,255,255,0.08);

            border: 1px solid rgba(255,255,255,0.15);

            border-radius: 18px;

            box-shadow: 0 20px 60px rgba(0,0,0,0.4);

            backdrop-filter: blur(15px);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #b9c7d6;
            margin-bottom: 30px;
        }

        input {
            width: 100%;

            padding: 14px;

            border-radius: 9px;

            border: 1px solid #40566d;

            background: rgba(0,0,0,0.25);

            color: white;

            outline: none;

            font-size: 16px;
        }

        button {
            width: 100%;

            margin-top: 18px;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #1677ff;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #0d64dc;
        }

        .error {
            margin-top: 18px;

            padding: 12px;

            border-radius: 8px;

            background: rgba(255,50,50,0.15);

            border: 1px solid rgba(255,80,80,0.4);

            color: #ffb0b0;

            text-align: center;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Digital AEGIS</h1>

    <p>Administrator Login</p>

    <form method="POST" action="/admin">

        <input
            type="password"
            name="password"
            placeholder="Admin Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

</div>

</body>
</html>
